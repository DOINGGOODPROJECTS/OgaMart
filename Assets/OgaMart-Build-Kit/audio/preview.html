<!doctype html><html><head><meta charset="utf-8"><title>OgaMart audio</title><style>
body{font-family:Inter,Arial;background:#FFF4DC;color:#2B2118;margin:24px} h1{font-family:Poppins,Arial;color:#1E6B45}
div{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
button{border:0;border-radius:14px;background:#fff;box-shadow:0 1px 0 #EAD8B4;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
button.on{background:#1E6B45;color:#fff} span{font-size:12px;color:#5C4A38} button.on span{color:#E3F1E8}
</style></head><body><h1>OgaMart audio</h1><p>Tap to play. Music loops until you tap it again.</p><div><button onclick="p('sfx/ui_tap.ogg',this)"><b>ui_tap</b><span>any button tap</span></button><button onclick="p('sfx/ui_tap_soft.ogg',this)"><b>ui_tap_soft</b><span>chips, list rows</span></button><button onclick="p('sfx/ui_back.ogg',this)"><b>ui_back</b><span>back button</span></button><button onclick="p('sfx/ui_toggle_on.ogg',this)"><b>ui_toggle_on</b><span>switch/checkbox on</span></button><button onclick="p('sfx/ui_toggle_off.ogg',this)"><b>ui_toggle_off</b><span>switch/checkbox off</span></button><button onclick="p('sfx/ui_error.ogg',this)"><b>ui_error</b><span>not enough coins, locked item</span></button><button onclick="p('sfx/ui_whoosh_open.ogg',this)"><b>ui_whoosh_open</b><span>bottom sheet opens</span></button><button onclick="p('sfx/ui_whoosh_close.ogg',this)"><b>ui_whoosh_close</b><span>sheet/pop-up closes</span></button><button onclick="p('sfx/ui_popup.ogg',this)"><b>ui_popup</b><span>pop-up card bounces in</span></button><button onclick="p('sfx/ui_slider_tick.ogg',this)"><b>ui_slider_tick</b><span>slider moves (every step)</span></button><button onclick="p('sfx/toast.ogg',this)"><b>toast</b><span>toast slides in</span></button><button onclick="p('sfx/notification.ogg',this)"><b>notification</b><span>character notification bubble</span></button><button onclick="p('sfx/coin.ogg',this)"><b>coin</b><span>single coin / +coins float</span></button><button onclick="p('sfx/coins_many.ogg',this)"><b>coins_many</b><span>coin fly, collect offline earnings</span></button><button onclick="p('sfx/cash_register.ogg',this)"><b>cash_register</b><span>big sale, VIP paid</span></button><button onclick="p('sfx/sale.ogg',this)"><b>sale</b><span>customer pays at checkout</span></button><button onclick="p('sfx/scan_beep.ogg',this)"><b>scan_beep</b><span>manual checkout scan</span></button><button onclick="p('sfx/restock.ogg',this)"><b>restock</b><span>shelf restocked</span></button><button onclick="p('sfx/shelf_upgrade.ogg',this)"><b>shelf_upgrade</b><span>shelf upgraded</span></button><button onclick="p('sfx/upgrade.ogg',this)"><b>upgrade</b><span>any store upgrade bought</span></button><button onclick="p('sfx/level_up.ogg',this)"><b>level_up</b><span>level up pop-up</span></button><button onclick="p('sfx/mission_complete.ogg',this)"><b>mission_complete</b><span>mission done / claimed</span></button><button onclick="p('sfx/achievement.ogg',this)"><b>achievement</b><span>achievement unlocked</span></button><button onclick="p('sfx/confetti_pop.ogg',this)"><b>confetti_pop</b><span>confetti burst</span></button><button onclick="p('sfx/build_start.ogg',this)"><b>build_start</b><span>construction starts</span></button><button onclick="p('sfx/build_complete.ogg',this)"><b>build_complete</b><span>building finished</span></button><button onclick="p('sfx/collect.ogg',this)"><b>collect</b><span>collect building coins</span></button><button onclick="p('sfx/door_chime.ogg',this)"><b>door_chime</b><span>customer enters (play sometimes)</span></button><button onclick="p('sfx/customer_happy.ogg',this)"><b>customer_happy</b><span>happy customer bubble</span></button><button onclick="p('sfx/customer_angry.ogg',this)"><b>customer_angry</b><span>angry customer bubble</span></button><button onclick="p('sfx/customer_sad.ogg',this)"><b>customer_sad</b><span>sad customer bubble</span></button><button onclick="p('sfx/out_of_stock.ogg',this)"><b>out_of_stock</b><span>shelf empty</span></button><button onclick="p('sfx/footstep.ogg',this)"><b>footstep</b><span>optional footsteps</span></button><button onclick="p('sfx/rush_start.ogg',this)"><b>rush_start</b><span>rush event starts</span></button><button onclick="p('sfx/timer_tick.ogg',this)"><b>timer_tick</b><span>last 10 seconds of a timer</span></button><button onclick="p('sfx/timer_end.ogg',this)"><b>timer_end</b><span>timer ends</span></button><button onclick="p('sfx/vip_arrive.ogg',this)"><b>vip_arrive</b><span>VIP order card</span></button><button onclick="p('sfx/dialogue_open.ogg',this)"><b>dialogue_open</b><span>dialogue screen opens</span></button><button onclick="p('sfx/dialogue_blip.ogg',this)"><b>dialogue_blip</b><span>text typing blip</span></button><button onclick="p('sfx/choice_select.ogg',this)"><b>choice_select</b><span>dialogue choice tapped</span></button><button onclick="p('sfx/relationship_up.ogg',this)"><b>relationship_up</b><span>friendship level up</span></button><button onclick="p('sfx/relationship_down.ogg',this)"><b>relationship_down</b><span>friendship drops</span></button><button onclick="p('sfx/delivery_arrive.ogg',this)"><b>delivery_arrive</b><span>delivery arrives</span></button><button onclick="p('sfx/car_horn.ogg',this)"><b>car_horn</b><span>random car horn on the street</span></button><button onclick="p('sfx/tutorial_hint.ogg',this)"><b>tutorial_hint</b><span>tutorial tip appears</span></button><button onclick="p('sfx/ad_reward.ogg',this)"><b>ad_reward</b><span>rewarded ad bonus given</span></button><button onclick="p('sfx/purchase.ogg',this)"><b>purchase</b><span>cosmetic purchase done</span></button><button onclick="p('sfx/mama_laugh.ogg',this)"><b>mama_laugh</b><span>Mama Biggie laughs / dances</span></button><button onclick="p('sfx/mama_huh.ogg',this)"><b>mama_huh</b><span>Mama Biggie complains</span></button><button onclick="p('jingles/jingle_level_up.ogg',this)"><b>jingle_level_up</b><span>longer level-up fanfare (Level Up screen)</span></button><button onclick="p('jingles/jingle_welcome_back.ogg',this)"><b>jingle_welcome_back</b><span>Welcome Back pop-up</span></button><button onclick="p('jingles/jingle_grand_opening.ogg',this)"><b>jingle_grand_opening</b><span>new business opens</span></button><button onclick="p('music/music_shop_loop.ogg',this)"><b>music_shop_loop</b><span>Shop scene music (loop, 112 bpm afrobeat feel)</span></button><button onclick="p('music/music_neighborhood_loop.ogg',this)"><b>music_neighborhood_loop</b><span>Neighborhood music (loop, 100 bpm highlife feel)</span></button><button onclick="p('music/music_menu_loop.ogg',this)"><b>music_menu_loop</b><span>Loading / menus / Settings (loop, 90 bpm)</span></button><button onclick="p('music/music_rush_loop.ogg',this)"><b>music_rush_loop</b><span>during rush events (loop, 128 bpm)</span></button></div>
<script>let a=null,b=null;function p(f,btn){if(a){a.pause();if(b)b.classList.remove('on');if(b===btn){a=null;b=null;return;}}a=new Audio(f);a.loop=f.startsWith('music');a.play();b=btn;btn.classList.add('on');a.onended=()=>btn.classList.remove('on');}</script></body></html>
